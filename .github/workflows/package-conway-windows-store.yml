name: Package Conway Microsoft Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install image export library
        run: python -m pip install 'Pillow>=11,<13'
      - name: Build and validate Store packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/conway-windows-store/qa | Out-Null
          Start-Transcript -Path dist/conway-windows-store/qa/build.log
          try {
            ./apps/conway-native/scripts/package-windows-store.ps1 -OutputDirectory "$PWD/dist/conway-windows-store"
          } finally { Stop-Transcript }
      - name: Retain Store upload bundle and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conway-microsoft-store-3.0.0.0
          path: |
            dist/conway-windows-store/*.msixbundle
            dist/conway-windows-store/packages/*.msix
            dist/conway-windows-store/SHA256SUMS.txt
            dist/conway-windows-store/qa/
            dist/conway-windows-store/icon-assets/Store-listing/
            dist/conway-windows-store/icon-assets/icon-inspection.png
            dist/conway-windows-store/icon-assets/icon-report.json
          if-no-files-found: error
          retention-days: 30
