name: Check native Conway Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-native-conway-linux.yml"
      - "apps/conway-native/linux/**"
      - "apps/conway-native/tests/**"
      - "apps/conway-native/LICENSE"
      - "scripts/check-conway-pointer.py"

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install native build and offscreen test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libjson-glib-dev xvfb desktop-file-utils appstream dbus-x11 openbox xdotool python3-pyatspi scrot
      - name: Build and check native app with isolated data
        working-directory: apps/conway-native
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -o pipefail
          mkdir -p qa
          {
            uname -a
            cc --version
            pkg-config --modversion gtk+-3.0 json-glib-1.0
            make -C linux
            cc -std=c11 -O1 -g -Wall -Wextra -Wno-unused-function -fsanitize=address,undefined tests/engine-c.c -o qa/engine-test
            qa/engine-test
            cc -std=c11 -O1 -g -Wall -Wextra -Wno-unused-function -fsanitize=address,undefined $(pkg-config --cflags json-glib-1.0) tests/population-c.c -o qa/population-test $(pkg-config --libs json-glib-1.0) -lm
            qa/population-test
            python3 tests/v2-compatibility.py
            desktop-file-validate linux/packaging/land.nithi.life.desktop
            make -C linux install-dist PREFIX=/app DESTDIR="$PWD/qa/staged"
            cmp LICENSE qa/staged/app/share/licenses/land.nithi.life/LICENSE
            LIFE_DATA_DIR="$PWD/qa/library" XDG_DATA_HOME="$PWD/qa/data" XDG_DATA_DIRS="$PWD/qa/staged/app/share:/usr/local/share:/usr/share" LIFE_SCREENSHOT="$PWD/qa/linux-native.png" xvfb-run -a -s '-screen 0 1440x1080x24' linux/nithi-life --smoke-test
            sha256sum linux/nithi-life qa/linux-native.png
          } 2>&1 | tee qa/native-checks.log
      - name: Validate AppStream metadata
        working-directory: apps/conway-native
        run: |
          set +e
          appstreamcli validate --no-net linux/packaging/land.nithi.life.metainfo.xml > qa/appstream-validation.log 2>&1
          result=$?
          cat qa/appstream-validation.log
          printf '%s\n' "$result" > qa/appstream-validation-exit-code.txt
          exit "$result"
      - name: Check real mouse input after closing the tour
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1080x24' bash -euo pipefail -c '
            openbox > apps/conway-native/qa/pointer-window-manager.log 2>&1 &
            export LIFE_DATA_DIR="$PWD/apps/conway-native/qa/pointer-library"
            export XDG_DATA_HOME="$PWD/apps/conway-native/qa/pointer-data"
            python3 scripts/check-conway-pointer.py apps/conway-native/qa "$LIFE_DATA_DIR" "$XDG_DATA_HOME/land.nithi.life" apps/conway-native/linux/nithi-life | tee apps/conway-native/qa/pointer-checks.log
          '
      - name: Retain native check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-conway-${{ matrix.arch }}
          path: apps/conway-native/qa/
          if-no-files-found: error
          retention-days: 14
